    <style>
      text { font-family: 'Segoe UI', Ubuntu, Arial, sans-serif; }
      .title { font-size: 23px; font-weight: 700; fill: #F2E8C9; letter-spacing: 1px; }
      .subtitle { font-size: 11px; fill: #91A0B2; letter-spacing: 2px; }
      .metric-label { font-size: 12px; fill: #9BAABC; }
      .metric-value { font-size: 21px; font-weight: 700; fill: #F1F4F7; }
      .panel-title { font-size: 15px; font-weight: 700; fill: #F2E8C9; }
      .panel-note { font-size: 10px; fill: #8796A8; }
