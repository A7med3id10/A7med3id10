    <style>
      text { font-family: 'Segoe UI', Ubuntu, Arial, sans-serif; }
      .title { font-size: 23px; font-weight: 700; fill: #F2E8C9; letter-spacing: 1px; }
      .subtitle { font-size: 11px; fill: #91A0B2; letter-spacing: 2px; }
      .metric-label { font-size: 12px; fill: #9BAABC; }
      .metric-value { font-size: 21px; font-weight: 700; fill: #F1F4F7; }
      .panel-title { font-size: 15px; font-weight: 700; fill: #F2E8C9; }
      .panel-note { font-size: 10px; fill: #8796A8; }
      .muted { font-size: 12px; fill: #8796A8; }
      .language-name { font-size: 11px; fill: #D7DEE8; }
      .language-percent { font-size: 10px; fill: #A8B4C3; }
      .breakdown-value { font-size: 17px; font-weight: 700; fill: #E5C766; }
      .metric-tile { transform-box: fill-box; transform-origin: center; animation: tileFloat 5s ease-in-out infinite; }
      .pulse-wave { stroke: #D4AF37; animation: wavePulse 2.8s ease-in-out infinite; }
      .radar-mark { transform-box: view-box; transform-origin: 1150px 49px; animation: radarRotate 18s linear infinite; }
      @keyframes tileFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
      @keyframes wavePulse { 0%, 100% { opacity: .3; stroke-width: 1; } 50% { opacity: .95; stroke-width: 2.2; } }
      @keyframes radarRotate { to { transform: rotate(360deg); } }
    </style>
